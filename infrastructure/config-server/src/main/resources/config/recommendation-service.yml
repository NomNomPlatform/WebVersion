spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://mongo:mongo@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/recommendation_logs?authSource=admin}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# LLM miễn phí — key truyền qua env var, KHÔNG hardcode.
# Groq (chính) → Gemini (fallback) → rule-based (khi không có key nào).
nomnom:
  ai:
    groq:
      api-key: "${GROQ_API_KEY:}"
      model: llama-3.3-70b-versatile
      base-url: https://api.groq.com/openai/v1
    gemini:
      api-key: "${GEMINI_API_KEY:}"
      model: gemini-2.0-flash
    order:
      - groq
      - gemini
    timeout-ms: 5000
