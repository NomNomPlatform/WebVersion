server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # Eureka server không tự đăng ký vào chính nó
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # Tắt self-preservation cho môi trường dev để service rớt được loại nhanh
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
