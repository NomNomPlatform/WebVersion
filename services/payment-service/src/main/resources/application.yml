server:
  port: 8085

spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:${SPRING_CONFIG_SERVER_URI:http://localhost:8888}

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── VNPay Sandbox Configuration ─────────────────────────────────────────────
# Local fallback so payment-service luôn có credentials kể cả khi Config Server
# chưa sẵn sàng (import là optional:). Config Server sẽ override khi có mặt.
payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}/payment/return
    amount-multiplier: 100
