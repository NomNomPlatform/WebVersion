spring:
  application:
    name: user-service-test
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false

jwt:
  secret: test_secret_key_for_unit_tests_min_32_chars_long
  expiration: 86400000

eureka:
  client:
    enabled: false
